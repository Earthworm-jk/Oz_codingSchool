services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=ozcoding
      - DB_PASSWORD=pw1234
      - DB_NAME=ai_health
    depends_on:
      mysql:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  mysql:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: pw1234
      MYSQL_DATABASE: ai_health
      MYSQL_USER: ozcoding
      MYSQL_PASSWORD: pw1234
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
