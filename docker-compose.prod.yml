services:
  fastapi:
    container_name: fastapi
    image: ${DOCKER_WEB_IMAGE}
    env_file:
      - .prod.env
    entrypoint: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_URL: redis://redis:6379/0
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - web_server

  ai-worker:
    container_name: ai-worker
    image: ${DOCKER_AI_WORKER_IMAGE}
    env_file:
      - .prod.env
    environment:
      REDIS_URL: redis://redis:6379/0
      PNEUMONIA_TASK_QUEUE: pneumonia:tasks
    volumes:
      - media_volume:/app/media
      - ./worker/models:/app/worker/models:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - web_server

  mysql:
    container_name: mysql
    image: mysql:8.0
    volumes:
      - mysql_volume:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_PORT: ${DB_PORT}
    ports:
      - "${DB_PORT}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 20s
      retries: 5
    networks:
      - web_server

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    networks:
      - web_server

  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/vol/web/static:ro
      - media_volume:/vol/web/media:ro
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - web_server

volumes:
  mysql_volume:
  static_volume:
  media_volume:

networks:
  web_server:
    driver: bridge
    name: ws
